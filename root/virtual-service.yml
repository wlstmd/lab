apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: root
spec:
  hosts:
    - "wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: root-service.root.svc.cluster.local
            port:
              number: 80
