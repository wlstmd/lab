apiVersion: apps/v1
kind: Deployment
metadata:
  name: dormitory
  labels:
    app.kubernetes.io/name: dormitory
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dormitory
  template:
    metadata:
      labels:
        app: dormitory
        app.kubernetes.io/name: dormitory
        app.kubernetes.io/version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: dormitory
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/wlstmd/dormitory:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: MYSQL_HOST
              value: dormitory-mysql-service
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: root
            - name: MYSQL_DATABASE
              value: dormitory
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dormitory-env
                  key: MYSQL_ROOT_PASSWORD
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dormitory-env
                  key: ADMIN_TOKEN
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
