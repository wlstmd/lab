apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: dormitory
spec:
  hosts:
    - "dormitory.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: dormitory-service.dormitory.svc.cluster.local
            port:
              number: 80
