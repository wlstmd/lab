apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal
  labels:
    app.kubernetes.io/name: terminal
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terminal
  template:
    metadata:
      labels:
        app: terminal
        app.kubernetes.io/name: terminal
        app.kubernetes.io/version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: terminal
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/wlstmd/terminal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
