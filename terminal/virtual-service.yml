apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: terminal
spec:
  hosts:
    - "terminal.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: terminal-service.terminal.svc.cluster.local
            port:
              number: 80
