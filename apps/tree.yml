apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tree
  namespace: argocd
spec:
  project: default
  destination:
    namespace: tree
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/wlstmd/lab.git
    targetRevision: HEAD
    path: tree
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
