apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: tree
spec:
  hosts:
    - "tree.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: tree-service.tree.svc.cluster.local
            port:
              number: 80
