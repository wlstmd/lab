apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: daily-ai
spec:
  hosts:
    - "daily-ai.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: daily-ai-service.daily-ai.svc.cluster.local
            port:
              number: 80
