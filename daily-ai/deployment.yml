apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-ai
  labels:
    app.kubernetes.io/name: daily-ai
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daily-ai
  template:
    metadata:
      labels:
        app: daily-ai
        app.kubernetes.io/name: daily-ai
        app.kubernetes.io/version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: daily-ai
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/wlstmd/daily-ai:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: daily-ai-env
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
