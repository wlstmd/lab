apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: keycap
spec:
  hosts:
    - "keycap.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: keycap-service.keycap.svc.cluster.local
            port:
              number: 80
