apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycap
  labels:
    app.kubernetes.io/name: keycap
    app.kubernetes.io/version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycap
  template:
    metadata:
      labels:
        app: keycap
        app.kubernetes.io/name: keycap
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: web
          image: ghcr.io/wlstmd/keycap:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: keycap-env
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
