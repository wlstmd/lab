apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: linux
spec:
  hosts:
    - "linux.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: linux-service.linux.svc.cluster.local
            port:
              number: 80
