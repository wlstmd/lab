apiVersion: apps/v1
kind: Deployment
metadata:
  name: visualized
  labels:
    app.kubernetes.io/name: visualized
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visualized
  template:
    metadata:
      labels:
        app: visualized
        app.kubernetes.io/name: visualized
        app.kubernetes.io/version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: visualized
                topologyKey: kubernetes.io/hostname
      serviceAccountName: visualized
      automountServiceAccountToken: true
      containers:
        - name: visualized
          image: ghcr.io/pmh-only/kube-universe:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
