apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: visualized
spec:
  hosts:
    - "visualized.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: visualized-service.visualized.svc.cluster.local
            port:
              number: 3000
