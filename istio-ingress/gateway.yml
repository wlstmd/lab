apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.wlstmd.cloud"
        - "wlstmd.cloud"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*.wlstmd.cloud"
        - "wlstmd.cloud"
      tls:
        mode: SIMPLE
        credentialName: wlstmd-cloud-tls
