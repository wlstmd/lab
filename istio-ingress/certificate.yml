apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wlstmd-cloud-tls
spec:
  secretName: wlstmd-cloud-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "wlstmd.cloud"
    - "argo.wlstmd.cloud"
    - "grafana.wlstmd.cloud"
    - "daily-ai.wlstmd.cloud"
    - "keycap.wlstmd.cloud"
    - "kmu-room-finder.wlstmd.cloud"
    - "spotify.wlstmd.cloud"
    - "terminal.wlstmd.cloud"
    - "tree.wlstmd.cloud"
    - "visualized.wlstmd.cloud"
    - "auth.wlstmd.cloud"
    - "vault.wlstmd.cloud"
    - "dormitory.wlstmd.cloud"
