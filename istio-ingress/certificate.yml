apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wlstmd-cloud-tls
spec:
  secretName: wlstmd-cloud-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "wlstmd.cloud"
    - "argo.wlstmd.cloud"
    - "web.wlstmd.cloud"
    - "spotify.wlstmd.cloud"
    - "terminal.wlstmd.cloud"
    - "linux.wlstmd.cloud"
    - "tree.wlstmd.cloud"
    - "wave.wlstmd.cloud"
