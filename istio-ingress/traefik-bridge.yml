apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: istio-bridge-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`wlstmd.cloud`) || HostRegexp(`^.+\.wlstmd\.cloud$`)
      kind: Rule
      services:
        - name: istio-ingressgateway
          namespace: istio-ingress
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: istio-bridge-https
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`wlstmd.cloud`) || HostSNI(`*.wlstmd.cloud`)
      services:
        - name: istio-ingressgateway
          namespace: istio-ingress
          port: 443
  tls:
    passthrough: true
