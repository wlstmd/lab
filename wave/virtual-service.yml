apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: wave
spec:
  hosts:
    - "wave.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: wave-service.wave.svc.cluster.local
            port:
              number: 80
