apiVersion: apps/v1
kind: Deployment
metadata:
  name: wave
  labels:
    app.kubernetes.io/name: wave
    app.kubernetes.io/version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wave
  template:
    metadata:
      labels:
        app: wave
        app.kubernetes.io/name: wave
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: web
          image: ghcr.io/wlstmd/wave:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
