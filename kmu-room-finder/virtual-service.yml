apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kmu-room-finder
spec:
  hosts:
    - "kmu-room-finder.wlstmd.cloud"
  gateways:
    - istio-ingress/public-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: kmu-room-finder-service.kmu-room-finder.svc.cluster.local
            port:
              number: 80
