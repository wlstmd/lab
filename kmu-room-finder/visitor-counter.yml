apiVersion: v1
kind: ServiceAccount
metadata:
  name: kmu-room-finder-counter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kmu-room-finder-counter
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kmu-room-finder-visitor-counts"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kmu-room-finder-counter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kmu-room-finder-counter
subjects:
  - kind: ServiceAccount
    name: kmu-room-finder-counter
    namespace: kmu-room-finder
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kmu-room-finder-visitor-counts
data:
  date: "1970-01-01"
  today: "0"
  total: "0"
