apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmu-room-finder
  labels:
    app.kubernetes.io/name: kmu-room-finder
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kmu-room-finder
  template:
    metadata:
      labels:
        app: kmu-room-finder
        app.kubernetes.io/name: kmu-room-finder
        app.kubernetes.io/version: v1
    spec:
      serviceAccountName: kmu-room-finder-counter
      automountServiceAccountToken: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kmu-room-finder
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/wlstmd/keimyung-room-finder:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          envFrom:
            - secretRef:
                name: kmu-room-finder-env
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
